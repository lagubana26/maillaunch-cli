[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maillaunch"
version = "1.0.0"
description = "CLI cold-email sender for Gmail and Microsoft 365"
requires-python = ">=3.10"

[project.scripts]
maillaunch = "src.main:main"

[tool.setuptools]
packages = ["src", "src.auth", "src.campaign", "src.sender"]

[tool.pytest.ini_options]
pythonpath = ["."]
